name: Update squad data

# Started once an hour by the "Hourly timer" workflow (timer.yml), or by hand.
on:
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: squad-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the scoring
        run: node --test scripts/challenge.test.mjs

      - name: Fetch data from the Riot API
        run: node scripts/update.mjs
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Save data
        run: |
          git config user.name "squad-bot"
          git config user.email "squad-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update squad data"
            git pull --rebase -X theirs
            git push
          fi
